<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#143528">
<title>Offline - WasteTrack</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #143528; color: #f7f4ec;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; text-align: center;
  }
  .card {
    background: #f7f4ec; color: #1d3a2f;
    border-radius: 4px 18px 4px 18px;
    padding: 40px 32px; max-width: 420px; width: 100%;
    box-shadow: 8px 8px 0 rgba(0,0,0,.35);
  }
  .code {
    font-family: ui-monospace, monospace; font-size: 13px; letter-spacing: 2px;
    color: #8a6d1c; margin-bottom: 12px;
  }
  h1 { font-size: 26px; margin-bottom: 12px; }
  p { font-size: 15px; line-height: 1.6; color: #3d5a4c; margin-bottom: 24px; }
  a.btn {
    display: inline-block; background: #feae2c; color: #143528;
    font-weight: 700; text-decoration: none; padding: 14px 28px;
    border-radius: 4px 14px 4px 14px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="code">OFFLINE</div>
    <h1>The truck can't reach the depot.</h1>
    <p>You're offline, so this page couldn't load. Your filed reports are safe &mdash;
       reconnect and try again.</p>
    <a class="btn" href="/">Try again</a>
  </div>
</body>
</html>
